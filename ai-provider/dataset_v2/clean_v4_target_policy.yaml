target_class_count:
  minimum_to_spend_gpu: 300
  max_ceiling_goal: 340
  upper_without_manual_review: 360
  hard_stop_above: 420
target_images:
  max_ceiling_build_cap: 260000
  stretch_build_cap_after_distribution_pass: 320000
  target_average_images_per_class: 750
new_class_gates:
  detection_or_segmentation_source:
    hold_images: 150
    accept_images: 350
    accept_instances: 500
    priority_accept_images: 800
  classification_pseudo_box_source:
    hold_images: 300
    accept_images: 700
    priority_accept_images: 1200
split_gates:
