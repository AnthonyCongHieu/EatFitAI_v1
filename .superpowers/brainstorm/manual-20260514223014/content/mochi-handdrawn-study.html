<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mochi Petdex Clean State Board</title>
  <style>
    :root {
      --bg: #f8f3eb;
      --ink: #241711;
      --muted: #7a6656;
      --paper: #fffaf2;
      --line: #eadac8;
      --red: #e95f70;
      --green: #49b36f;
      --gold: #f5b936;
      font-family: Inter, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
    }

    header {
      max-width: 1180px;
      margin: 0 auto 18px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 44px);
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 8px auto 0;
      max-width: 860px;
      color: var(--muted);
      line-height: 1.45;
    }

    .board {
      max-width: 1420px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      min-height: 292px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--paper);
      box-shadow: 0 10px 26px rgba(64, 42, 24, 0.08);
      overflow: hidden;
      cursor: pointer;
    }

    .card.selected {
      outline: 3px solid var(--green);
      border-color: var(--green);
    }

    .stage {
      position: relative;
      height: 205px;
      margin: 10px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 88%, rgba(73, 179, 111, 0.16), transparent 34%),
        linear-gradient(180deg, #fff8ee 0%, #eee0cf 100%);
    }

    .num {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 6;
      width: 29px;
      height: 29px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--red);
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(130, 59, 52, 0.2);
    }

    .badge {
      position: absolute;
      top: 13px;
      right: 12px;
      z-index: 6;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      background: rgba(255, 250, 242, 0.88);
      color: #746154;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .shadow {
      position: absolute;
      bottom: 16px;
      width: 96px;
      height: 17px;
      border-radius: 50%;
      background: rgba(66, 42, 25, 0.2);
      filter: blur(3px);
      z-index: 0;
    }

    .pet {
      position: relative;
      z-index: 2;
      width: 118px;
      height: 176px;
      transform-origin: 50% 94%;
      animation: stateIdle 2.7s ease-in-out infinite;
    }

    .pet svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pet g {
      transform-box: fill-box;
    }

    .scene-prop {
      position: absolute;
      z-index: 4;
      pointer-events: none;
      color: var(--ink);
      font-weight: 900;
    }

    .scene-prop.hand-right {
      right: 9px;
      bottom: 27px;
      width: 58px;
      height: 70px;
    }

    .scene-prop.hand-left {
      left: 8px;
      bottom: 30px;
      width: 62px;
      height: 72px;
    }

    .scene-prop.ground {
      left: 50%;
      bottom: 12px;
      width: 132px;
      height: 54px;
      transform: translateX(-50%);
      z-index: 3;
    }

    .scene-prop.air-right {
      right: 19px;
      top: 31px;
      width: 46px;
      height: 46px;
    }

    .scene-prop.hand-right::before,
    .scene-prop.hand-left::before {
      content: "";
      position: absolute;
      top: 29px;
      width: 42px;
      height: 16px;
      border: 8px solid #9f6c43;
      border-top: 0;
      border-left: 0;
      border-radius: 0 0 42px 0;
      z-index: 2;
    }

    .scene-prop.hand-right::before {
      left: -24px;
      transform: rotate(-14deg);
    }

    .scene-prop.hand-left::before {
      right: -24px;
      transform: scaleX(-1) rotate(-14deg);
    }

    .scene-prop::after {
      content: "";
      position: absolute;
      z-index: 6;
      width: 22px;
      height: 17px;
      border-radius: 50%;
      background: #9f6c43;
      box-shadow: inset -5px -4px 0 rgba(72, 45, 24, 0.18);
    }

    .scene-prop.hand-right::after {
      left: 8px;
      top: 36px;
    }

    .scene-prop.hand-left::after {
      right: 8px;
      top: 38px;
    }

    .scene-prop.air-right::before,
    .scene-prop.air-right::after,
    .scene-prop.ground::before,
    .scene-prop.ground::after {
      content: none;
    }

    .prop-phone,
    .prop-panel,
    .prop-note,
    .prop-board {
      position: absolute;
      border: 3px solid #241711;
      background: #fffdf5;
      box-shadow: 0 4px 0 rgba(36, 23, 17, 0.12);
    }

    .prop-phone {
      right: 3px;
      bottom: 8px;
      width: 36px;
      height: 58px;
      border-radius: 9px;
      background: #241711;
      padding: 6px;
    }

    .prop-phone span {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      background: #dff2ec;
      color: #49b36f;
      font-size: 18px;
    }

    .prop-panel {
      right: 1px;
      bottom: 8px;
      width: 50px;
      height: 58px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: #49b36f;
      font-size: 13px;
      line-height: 1.05;
      text-align: center;
    }

    .prop-note {
      left: 5px;
      bottom: 8px;
      width: 48px;
      height: 56px;
      border-radius: 6px;
      transform: rotate(-7deg);
    }

    .prop-note::before {
      content: "";
      position: absolute;
      inset: 13px 8px auto;
      height: 3px;
      background: #b9aa92;
      box-shadow: 0 12px 0 #b9aa92, 0 24px 0 #b9aa92;
    }

    .prop-pencil {
      position: absolute;
      right: 7px;
      bottom: 2px;
      width: 13px;
      height: 66px;
      border: 3px solid #241711;
      border-radius: 9px;
      background: #61b96a;
      transform: rotate(30deg);
    }

    .prop-pencil::after {
      content: "";
      position: absolute;
      left: -3px;
      bottom: -14px;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 16px solid #f0ca88;
    }

    .prop-scan {
      position: absolute;
      right: 0;
      bottom: 6px;
      width: 54px;
      height: 62px;
      border: 4px solid #49b36f;
      border-radius: 8px;
      border-style: dashed;
      display: grid;
      place-items: center;
      color: #49b36f;
      font-size: 18px;
    }

    .prop-bubble {
      position: absolute;
      inset: 0;
      border: 3px solid #eadac8;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      display: grid;
      place-items: center;
      font-size: 28px;
      color: #49b36f;
    }

    .air-mark {
      position: absolute;
      right: 0;
      top: 7px;
      min-width: 28px;
      min-height: 28px;
      display: grid;
      place-items: center;
      color: #49b36f;
      font-size: 27px;
      line-height: 1;
      text-shadow:
        -2px -2px 0 #fff8ee,
        2px -2px 0 #fff8ee,
        -2px 2px 0 #fff8ee,
        2px 2px 0 #fff8ee;
    }

    .air-mark.hi {
      right: -4px;
      top: 14px;
      font-size: 22px;
    }

    .air-mark.alert {
      color: #e95f70;
      font-size: 36px;
      transform: rotate(-7deg);
    }

    .air-mark.zzz {
      color: #4f6382;
      font-size: 26px;
      letter-spacing: 1px;
    }

    .thought-mini {
      position: absolute;
      right: 0;
      top: 3px;
      width: 42px;
      height: 26px;
      border: 3px solid #eadac8;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
    }

    .thought-mini::before,
    .thought-mini::after {
      content: "";
      position: absolute;
      border: 2px solid #eadac8;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
    }

    .thought-mini::before {
      left: -10px;
      bottom: -8px;
      width: 12px;
      height: 12px;
    }

    .thought-mini::after {
      left: -19px;
      bottom: -17px;
      width: 6px;
      height: 6px;
    }

    .thought-mini span {
      display: block;
      text-align: center;
      color: #b9aa92;
      font-size: 18px;
      line-height: 18px;
    }

    .prop-food {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 8px;
      height: 36px;
      border: 3px solid #241711;
      border-radius: 50%;
      background: #fffdf5;
    }

    .prop-food::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 5px;
      width: 34px;
      height: 18px;
      border-radius: 50%;
      background: #f4b66b;
      box-shadow: 42px 2px 0 #8bc66a, 70px -2px 0 #e95f70;
    }

    .prop-bottle {
      position: absolute;
      right: -2px;
      bottom: 21px;
      width: 62px;
      height: 23px;
      border: 3px solid #241711;
      border-radius: 12px;
      background: #58c7f7;
      transform: rotate(-10deg);
    }

    .prop-fruit {
      position: absolute;
      right: 0;
      bottom: 7px;
      width: 55px;
      height: 42px;
      border: 3px solid #241711;
      border-radius: 50%;
      background: #fffdf5;
    }

    .prop-fruit::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 8px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e95f70;
      box-shadow: 24px 2px 0 #f5b936;
    }

    .prop-board {
      right: -2px;
      bottom: 4px;
      width: 52px;
      height: 62px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #e95f70;
      font-size: 15px;
      text-align: center;
      line-height: 1;
    }

    .prop-trophy {
      position: absolute;
      right: 4px;
      bottom: 7px;
      width: 44px;
      height: 48px;
      border: 3px solid #241711;
      border-radius: 8px 8px 18px 18px;
      background: #f5b936;
    }

    .prop-trophy::before,
    .prop-trophy::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 16px;
      height: 22px;
      border: 3px solid #241711;
      border-radius: 50%;
      background: transparent;
    }

    .prop-trophy::before { left: -14px; }
    .prop-trophy::after { right: -14px; }

    .info {
      padding: 0 12px 12px;
    }

    h2 {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.38;
    }

    .frames {
      margin-top: 7px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #9a8674;
      font-size: 10px;
      font-weight: 800;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--line);
    }

    .dot.on {
      background: var(--red);
      animation: frameBlink 1.2s steps(1) infinite;
    }

    .fx {
      position: absolute;
      z-index: 4;
      pointer-events: none;
    }

    .note-bubble {
      top: 34px;
      right: 30px;
      width: 44px;
      height: 29px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(80, 50, 26, 0.14);
      animation: driftBubble 2.4s ease-in-out infinite;
    }

    .note-bubble::before,
    .note-bubble::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(80, 50, 26, 0.12);
    }

    .note-bubble::before {
      width: 11px;
      height: 11px;
      left: 10px;
      bottom: -13px;
    }

    .note-bubble::after {
      width: 7px;
      height: 7px;
      left: 0;
      bottom: -22px;
    }

    .spark {
      width: 7px;
      height: 7px;
      border-radius: 3px;
      background: var(--gold);
      animation: sparkFloat 1s ease-out infinite;
    }

    .spark.one { top: 44px; left: 44px; }
    .spark.two { top: 32px; right: 38px; background: var(--green); animation-delay: 0.16s; }
    .spark.three { top: 86px; right: 27px; background: #f06f93; animation-delay: 0.32s; }

    .sound-lines {
      top: 58px;
      right: 42px;
      color: var(--ink);
      font-size: 28px;
      font-weight: 900;
      animation: popIn 0.8s ease-in-out infinite;
    }

    .pet[data-motion="wave"] { animation: stateWave 1.6s ease-in-out infinite; }
    .pet[data-motion="happy"] { animation: stateHappy 1.25s cubic-bezier(0.25, 1.25, 0.35, 1) infinite; }
    .pet[data-motion="jump"] { animation: stateJump 0.86s cubic-bezier(0.22, 1.2, 0.36, 1) infinite; }
    .pet[data-motion="think"] { animation: stateThink 2.2s ease-in-out infinite; }
    .pet[data-motion="alert"] { animation: stateAlert 1.05s ease-in-out infinite; }
    .pet[data-motion="sleep"] { animation: stateSleep 3.2s ease-in-out infinite; }
    .pet[data-motion="write"] { animation: stateWrite 1.7s ease-in-out infinite; }
    .pet[data-motion="phone"] { animation: statePhone 1.8s ease-in-out infinite; }
    .pet[data-motion="scan"] { animation: stateScan 1.45s ease-in-out infinite; }
    .pet[data-motion="drink"] { animation: stateDrink 1.35s ease-in-out infinite; }
    .pet[data-motion="run"] { animation: stateRun 0.72s ease-in-out infinite; }
    .pet[data-motion="streak"] { animation: stateStreak 1.9s ease-in-out infinite; }

    .pet[data-motion="wave"] #Arm_R { transform-origin: 25% 12%; animation: armWave 0.68s ease-in-out infinite; }
    .pet[data-motion="happy"] #Arm_L,
    .pet[data-motion="happy"] #Arm_R,
    .pet[data-motion="jump"] #Arm_L,
    .pet[data-motion="jump"] #Arm_R { transform-origin: 50% 12%; animation: armUp 0.86s ease-in-out infinite; }
    .pet[data-motion="think"] #Arm_L { transform-origin: 75% 10%; animation: armThink 2.2s ease-in-out infinite; }
    .pet[data-motion="alert"] #Arm_L,
    .pet[data-motion="alert"] #Arm_R { transform-origin: 50% 12%; animation: armStartle 1.05s ease-in-out infinite; }
    .pet[data-motion="write"] #Arm_R { transform-origin: 25% 12%; animation: armWrite 0.58s ease-in-out infinite; }
    .pet[data-motion="scan"] #Arm_R { transform-origin: 25% 12%; animation: armPoint 1.45s ease-in-out infinite; }
    .pet[data-motion="run"] #Leg_L { transform-origin: 50% 5%; animation: legRunL 0.72s ease-in-out infinite; }
    .pet[data-motion="run"] #Leg_R { transform-origin: 50% 5%; animation: legRunR 0.72s ease-in-out infinite; }

    .pet[data-motion="idle"] #Eye_L,
    .pet[data-motion="idle"] #Eye_R,
    .pet[data-motion="phone"] #Eye_L,
    .pet[data-motion="phone"] #Eye_R { transform-origin: 50% 50%; animation: blink 3.4s steps(1) infinite; }

    .card:hover .pet {
      animation-duration: 0.55s;
    }

    @keyframes stateIdle {
      0%, 100% { transform: translateY(0) scale(1); }
      48% { transform: translateY(-5px) scaleX(0.99) scaleY(1.025); }
    }

    @keyframes stateWave {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      36% { transform: translateY(-7px) rotate(-2deg) scaleY(1.02); }
      72% { transform: translateY(2px) rotate(2deg) scaleX(1.02) scaleY(0.98); }
    }

    @keyframes stateHappy {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-18px) scaleX(0.96) scaleY(1.08); }
      64% { transform: translateY(3px) scaleX(1.06) scaleY(0.92); }
    }

    @keyframes stateJump {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      14% { transform: translateY(9px) scaleX(1.08) scaleY(0.9); }
      38% { transform: translateY(-44px) scaleX(0.9) scaleY(1.12) rotate(-3deg); }
      58% { transform: translateY(-35px) rotate(3deg); }
      78% { transform: translateY(6px) scaleX(1.08) scaleY(0.88); }
    }

    @keyframes stateThink {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      32% { transform: translateY(-7px) rotate(6deg); }
      70% { transform: translateY(-3px) rotate(-4deg); }
    }

    @keyframes stateAlert {
      0%, 100% { transform: translateX(0) translateY(0) scale(1); }
      18% { transform: translateX(-5px) translateY(-8px) scale(1.04); }
      34% { transform: translateX(4px) translateY(2px) scale(0.98); }
      52% { transform: translateX(-3px) translateY(-2px); }
    }

    @keyframes stateSleep {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 1; }
      45% { transform: translateY(8px) rotate(-5deg); opacity: 0.92; }
      72% { transform: translateY(4px) rotate(2deg); }
    }

    @keyframes stateWrite {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(-2deg); }
    }

    @keyframes statePhone {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      45% { transform: translateY(-5px) rotate(4deg); }
    }

    @keyframes stateScan {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.035); }
    }

    @keyframes stateDrink {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      35% { transform: translateY(-5px) rotate(-6deg); }
      70% { transform: translateY(2px) rotate(3deg); }
    }

    @keyframes stateRun {
      0%, 100% { transform: translateX(-3px) translateY(0) rotate(-2deg) scaleX(1.02); }
      50% { transform: translateX(4px) translateY(-10px) rotate(3deg) scaleX(0.98) scaleY(1.05); }
    }

    @keyframes stateStreak {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      42% { transform: translateY(-8px) rotate(-4deg); }
      70% { transform: translateY(-2px) rotate(3deg); }
    }

    @keyframes armWave {
      0%, 100% { transform: rotate(-12deg); }
      40% { transform: rotate(42deg); }
      70% { transform: rotate(20deg); }
    }

    @keyframes armUp {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(42deg); }
    }

    @keyframes armThink {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-36deg); }
    }

    @keyframes armStartle {
      0%, 100% { transform: rotate(0deg); }
      24% { transform: rotate(32deg); }
    }

    @keyframes armWrite {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(16deg); }
    }

    @keyframes armPoint {
      0%, 100% { transform: rotate(6deg); }
      48% { transform: rotate(25deg); }
    }

    @keyframes legRunL {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
    }

    @keyframes legRunR {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-22deg); }
    }

    @keyframes blink {
      0%, 42%, 48%, 100% { transform: scaleY(1); }
      44%, 46% { transform: scaleY(0.08); }
    }

    @keyframes driftBubble {
      0%, 100% { transform: translateY(0) scale(0.96); opacity: 0.76; }
      50% { transform: translateY(-10px) scale(1.04); opacity: 1; }
    }

    @keyframes sparkFloat {
      0% { transform: translateY(12px) scale(0); opacity: 0; }
      30% { transform: translateY(0) scale(1.2); opacity: 1; }
      100% { transform: translateY(-32px) scale(0.35); opacity: 0; }
    }

    @keyframes popIn {
      0%, 100% { transform: scale(0.84); opacity: 0.55; }
      45% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes frameBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.32; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (max-width: 760px) {
      body { padding: 12px; }
      .board { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
      .stage { height: 188px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>✨ MOCHI - PETDEX CLEAN STATE BOARD ✨</h1>
    <p class="subtitle">Bản thử sạch hơn dựa trên state viewer kiểu Petdex: 30 state có frame count, motion curve, biểu cảm và prop riêng. Prop được đặt cạnh tay, ngoài đầu hoặc trong bubble để không đè lên mắt/mũi/miệng. Source SVG: <code>D:\image (1).svg</code>.</p>
  </header>

  <main class="board" id="board"></main>

  <script>
    const NS = 'http://www.w3.org/2000/svg';

    function makeGroup(svg, id, paths) {
      const group = document.createElementNS(NS, 'g');
      group.setAttribute('id', id);
      paths.forEach((path) => {
        if (path) group.appendChild(path);
      });
      svg.appendChild(group);
    }

    function rig(slot) {
      const svg = slot.querySelector('svg');
      if (!svg || svg.querySelector('#Body')) return;
      const p = Array.from(svg.querySelectorAll('path'));
      if (p.length < 33) return;

      p[0].style.display = 'none';
      p[1].style.display = 'none';
      Array.from(svg.querySelectorAll('defs')).forEach((def) => svg.appendChild(def));

      makeGroup(svg, 'Ear_L', [p[28], p[29]]);
      makeGroup(svg, 'Ear_R', [p[30], p[31]]);
      makeGroup(svg, 'Leg_L', [p[3], p[7]]);
      makeGroup(svg, 'Leg_R', [p[4], p[8]]);
      makeGroup(svg, 'Body', [p[2], p[5], p[6]]);
      makeGroup(svg, 'Arm_L', [p[27]]);
      makeGroup(svg, 'Arm_R', [p[26]]);
      makeGroup(svg, 'Muzzle', [p[9], p[10], p[13], p[14], p[15], p[16]]);
      makeGroup(svg, 'Eye_R', [p[22], p[23], p[11]]);
      makeGroup(svg, 'Eye_L', [p[24], p[25], p[12]]);
      makeGroup(svg, 'Headband', [p[17], p[18], p[19], p[20], p[21], p[32]]);
    }

    function addOverlay(svg, id, markup) {
      const group = document.createElementNS(NS, 'g');
      group.setAttribute('id', id);
      group.innerHTML = markup;
      svg.appendChild(group);
    }

      if (!svg) return;
      if (state.face !== 'neutral') {
        const eyeL = svg.querySelector('#Eye_L');
        const eyeR = svg.querySelector('#Eye_R');

      }
      addOverlay(svg, 'FaceOverlay', faceMarkup(state.face));

        confetti: '',
        thought: '<div class="scene-prop air-right"><span class="thought-mini"><span>...</span></span></div>',
        bang: '<div class="scene-prop air-right"><span class="air-mark alert">!</span></div>',
        zzz: '<div class="scene-prop air-right"><span class="air-mark zzz">Zz</span></div>',
        notebook: '<div class="scene-prop hand-left"><span class="prop-note"></span></div>',
        pen: '<div class="scene-prop hand-right"><span class="prop-pencil"></span></div>',
        phone: '<div class="scene-prop hand-right"><span class="prop-phone"><span>•</span></span></div>',
        app: '<div class="scene-prop hand-right"><span class="prop-phone"><span>✓</span></span></div>',
        scan: '<div class="scene-prop hand-right"><span class="prop-scan">□</span></div>',
        chart: '<div class="scene-prop hand-right"><span class="prop-panel">▂▅▇</span></div>',
        kcal: '<div class="scene-prop hand-right"><span class="prop-panel">520<br>kcal</span></div>',
        bowl: '<div class="scene-prop ground"><span class="prop-food"></span></div>',
        plate: '<div class="scene-prop ground"><span class="prop-food"></span></div>',
        fork: '<div class="scene-prop ground"><span class="prop-food"></span></div>',
        water: '<div class="scene-prop hand-right"><span class="prop-bottle"></span></div>',
        fruit: '<div class="scene-prop hand-right"><span class="prop-fruit"></span></div>',
        check: '<div class="scene-prop air-right"><span class="air-mark">✓</span></div>',
        bell: '<div class="scene-prop air-right"><span class="air-mark alert">!</span></div>',
        sweat: '<div class="scene-prop air-right"><span class="air-mark" style="color:#58c7f7">••</span></div>',
        streak: '<div class="scene-prop hand-right"><span class="prop-board">30<br>NGÀY</span></div>',
        trophy: '<div class="scene-prop hand-right"><span class="prop-trophy"></span></div>',
      };
      return props[prop] ?? '';
    }

    function fxMarkup(state) {
      if (state.prop === 'confetti' || state.prop === 'trophy') {
        return '<span class="fx spark one"></span><span class="fx spark two"></span><span class="fx spark three"></span>';
      }
      return '';
    }

    function frameDots(count) {
      return Array.from({ length: Math.min(count, 8) }, (_, index) =>
        `<span class="dot ${index === 0 ? 'on' : ''}"></span>`
      ).join('');
    }

    function renderBoard(svgText) {
      const board = document.getElementById('board');
      board.innerHTML = STATES.map((state) => `
        <article class="card" data-id="${state.id}" onclick="selectCard(this)">
          <span class="num">${String(state.id).padStart(2, '0')}</span>
          <span class="badge">${state.tag}</span>
          <div class="stage">
            ${fxMarkup(state)}
            <div class="shadow"></div>
            <div class="pet" data-motion="${state.motion}" data-state="${state.id}">${svgText}</div>
            ${propSceneMarkup(state)}
          </div>
          <div class="info">
            <h2>${state.label}</h2>
            <p>${state.desc}</p>
            <div class="frames">${frameDots(state.frames)}<span>${state.frames} frames</span></div>
          </div>
        </article>
      `).join('');

      board.querySelectorAll('.pet').forEach((slot) => {
        const state = STATES.find((item) => String(item.id) === slot.dataset.state);
        rig(slot);
        applyState(slot, state);
      });
    }

    function selectCard(card) {
      document.querySelectorAll('.card').forEach((item) => item.classList.remove('selected'));
      card.classList.add('selected');
      window.parent?.postMessage?.({
        type: 'selection',
        detail: {
          id: card.dataset.id,
          label: card.querySelector('h2')?.textContent,
        },
      }, '*');
    }

    async function boot() {
      const svgText = await fetch('/files/image-1-source.svg').then((response) => response.text());
      renderBoard(svgText);
    }

    boot();
  </script>
</body>
</html>
